[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -F
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=5

[program:nginx]
command=nginx -g 'daemon off;'
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=10

; ── Laravel queue worker ─────────────────────────────────────────────────
; Jobs (tenant provisioning, modül migration, AI üretimi) redis kuyruğunda
; bekler — worker olmadan HİÇ çalışmazlar. --max-time ile worker saatte bir
; kendini yeniler (memory leak / stale code koruması; supervisor yeniden
; başlatır). Deploy sonrası yeni kodu alması için: queue:restart.
[program:laravel-worker]
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --timeout=300 --max-time=3600
numprocs=2
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
stopwaitsecs=310
priority=15

; ── Laravel scheduler ────────────────────────────────────────────────────
; routes/console.php'deki zamanlanmış görevleri (gece 02:00 tenant yedeği,
; saatlik traefik:sync) çalıştırır. schedule:work dakikada bir tick atar —
; ayrı cron kurulumu gerektirmez.
[program:laravel-scheduler]
command=php /var/www/html/artisan schedule:work
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autorestart=true
priority=20
