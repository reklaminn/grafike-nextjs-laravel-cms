# ═══════════════════════════════════════════════
# Grafike CMS - Nginx Configuration
# ═══════════════════════════════════════════════

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # ─── Security Headers ─────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Gzip Compression ─────────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/xml
        application/rss+xml
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ─── Static Asset Caching ─────────────────
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ─── Vite Build Assets (versioned) ────────
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ─── Laravel Application ──────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ─── PHP-FPM ──────────────────────────────
    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;

        # IMPORTANT: include must come FIRST, our overrides AFTER, so that the
        # default fastcgi_params file (which sets `fastcgi_param HTTPS $https
        # if_not_empty;`) cannot override our HTTPS=on below.
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;

        # ── HTTPS detection (Traefik terminates TLS, forwards as HTTP) ─────
        # Without these, Symfony Request::isSecure() can return false even
        # when the original client request was HTTPS. We always set HTTPS=on
        # because this container is *only* reachable via Traefik (which only
        # accepts HTTPS on port 443 and redirects HTTP→HTTPS). The /up health
        # check from Docker's HEALTHCHECK also works fine with HTTPS=on
        # because Laravel's health endpoint is scheme-agnostic.
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
        fastcgi_param SERVER_PORT 443;
        fastcgi_param REQUEST_SCHEME https;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
    }

    # ─── Deny Hidden Files ────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }

    # ─── Deny PHP in uploads ──────────────────
    location ~* /storage/.*\.php$ {
        deny all;
    }

    # ─── Robots & Favicon ─────────────────────
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ─── Error Pages ──────────────────────────
    error_page 404 /index.php;

    # ─── Limits ───────────────────────────────
    client_max_body_size 64M;
}
