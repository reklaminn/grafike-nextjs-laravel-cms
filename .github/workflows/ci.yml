name: CI

on:
  push:
    branches: [main, feat/multi-tenant]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests (PHP 8.4)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Prod Docker imajı PHP 8.4 (Dockerfile) — CI aynı sürümde koşar
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3, gd, zip, intl, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        # CI suite: bilinen eski hatalı dosyalar hariç (bkz. phpunit.xml CI testsuite).
        # Tam suite ~30 dk sürüp 98 eski hatayla kırmızı kalıyordu.
        run: php artisan test --testsuite=CI

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Composer security audit
        # --locked: vendor kurulumu gerektirmeden composer.lock üzerinden denetler
        run: composer audit --locked
