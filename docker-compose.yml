# ─────────────────────────────────────────────────────────────────────────────
# Grafike CMS — High-Availability Docker Compose
#
# Architecture:
#   3 identical app containers (app1/app2/app3) all serve ALL tenant sites.
#   Traefik health-checks each container via Docker HEALTHCHECK; if one crashes
#   the other two continue serving 100% of traffic — no site goes down.
#
#   MariaDB and Traefik run in separate containers on the same VPS and are NOT
#   defined here. They are reached via the shared `traefik_proxy` external network.
# ─────────────────────────────────────────────────────────────────────────────

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL}
  APP_KEY: ${APP_KEY}

  # MariaDB is an external container on this VPS — connect by container name.
  DB_CONNECTION: mariadb
  DB_HOST: ${DB_HOST:-mariadb-admindb}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Grafike CMS}

  SESSION_DOMAIN: ${SESSION_DOMAIN:-}
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: lax

  CMS_CACHE_ENABLED: ${CMS_CACHE_ENABLED:-true}
  CMS_CACHE_TTL: ${CMS_CACHE_TTL:-600}
  CMS_FRONTEND_URL: ${CMS_FRONTEND_URL:-}
  CMS_REVALIDATE_SECRET: ${CMS_REVALIDATE_SECRET}

  SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

  # stancl/tenancy
  TENANCY_DB_PREFIX: ${TENANCY_DB_PREFIX:-tenant_}
  CENTRAL_DOMAIN: ${APP_DOMAIN}

# ── Traefik labels shared across ALL 3 app containers ──────────────────────
# Defining identical labels on all 3 ensures:
#  - Routers (grafike-admin, grafike-api, grafike-assets) survive if any single
#    container goes down — Traefik always has at least one source for the config.
#  - The grafike-lb service definition is CONSISTENT across containers.
#    Inconsistent service definitions (e.g. healthcheck on app1 only) cause
#    Traefik to silently drop the entire service and all its routers.
x-app-labels: &app-labels
  traefik.enable: "true"
  traefik.docker.network: traefik_proxy

  # ── HTTP → HTTPS global redirect ───────────────────────────────────────────
  # permanent: "false" → 307 Temporary Redirect (method-preserving).
  # IMPORTANT: Do NOT use permanent: "true" (→ 301) here — browsers convert
  # POST to GET on 301, silently discarding form bodies (sections_json etc.).
  # 307 preserves POST/PUT/PATCH so form data reaches the HTTPS handler intact.
  # If you change this back to permanent later, use a Traefik version that sends
  # 308 (not 301) for non-GET methods — or keep permanent: "false".
  # Traefik v3 syntax: plain regex inside HostRegexp (no `{name:pattern}` group).
  traefik.http.routers.http-catchall.rule: "HostRegexp(`.+`)"
  traefik.http.routers.http-catchall.entrypoints: web
  traefik.http.routers.http-catchall.middlewares: https-redirect
  traefik.http.routers.http-catchall.priority: "1"
  traefik.http.middlewares.https-redirect.redirectscheme.scheme: https
  traefik.http.middlewares.https-redirect.redirectscheme.permanent: "false"

  # ── Backend router: /admin ──────────────────────────────────────────────────
  # LEGACY: `graficms.grafike.site` OR'd alongside ${APP_DOMAIN} during the
  # cms.grafcore.com migration so both hosts reach the admin panel in parallel.
  # Remove the `|| Host(`graficms.grafike.site`)` clause (here + in api/assets
  # rules below + in docker-compose.hostinger.yml frontend rule) once the old
  # domain is decommissioned.
  #
  # NOTE: Traefik v3.7.x parses `Host()` with exactly one argument — the
  # documented multi-arg form `Host(`a`, `b`)` errors out.  Use OR explicitly.
  # The rule MUST be byte-identical to the matching rule in
  # docker-compose.hostinger.yml's `app:` service labels — Traefik dedupes
  # routers across the 4 app containers (app, app1, app2, app3) only when
  # every label matches exactly.
  traefik.http.routers.grafike-admin.rule: "(Host(`${APP_DOMAIN}`) || Host(`graficms.grafike.site`)) && PathPrefix(`/admin`)"
  traefik.http.routers.grafike-admin.entrypoints: websecure
  traefik.http.routers.grafike-admin.tls: "true"
  traefik.http.routers.grafike-admin.tls.certresolver: mytlschallenge
  # ACME scope: ONLY request a LE cert for graficms.grafike.site.
  # Without this, Traefik would derive both hosts from the router rule
  # and ask for a combined SAN cert — but cms.grafcore.com is behind
  # Cloudflare proxy, which terminates TLS at the edge and never forwards
  # the ALPN extension required by the TLS-ALPN-01 challenge.  The combined
  # request fails repeatedly until the LE "5 failed authorizations per
  # identifier per hour" rate limit kicks in.
  #
  # cms.grafcore.com gets its cert from the CF Origin Certificate loaded
  # via the file provider (traefik-dynamic/certs.yaml), matched by SNI.
  # Drop this line once graficms.grafike.site is decommissioned.
  traefik.http.routers.grafike-admin.tls.domains[0].main: graficms.grafike.site
  traefik.http.routers.grafike-admin.service: grafike-lb
  traefik.http.routers.grafike-admin.middlewares: grafike-headers@docker
  traefik.http.routers.grafike-admin.priority: "200"

  # ── Backend router: /api ────────────────────────────────────────────────────
  # LEGACY graficms.grafike.site — see grafike-admin note above.
  traefik.http.routers.grafike-api.rule: "(Host(`${APP_DOMAIN}`) || Host(`graficms.grafike.site`)) && PathPrefix(`/api`)"
  traefik.http.routers.grafike-api.entrypoints: websecure
  traefik.http.routers.grafike-api.tls: "true"
  traefik.http.routers.grafike-api.tls.certresolver: mytlschallenge
  # ACME scope — see grafike-admin note above.
  traefik.http.routers.grafike-api.tls.domains[0].main: graficms.grafike.site
  traefik.http.routers.grafike-api.service: grafike-lb
  traefik.http.routers.grafike-api.middlewares: grafike-headers@docker
  traefik.http.routers.grafike-api.priority: "200"

  # ── Backend router: static assets + health ─────────────────────────────────
  # LEGACY graficms.grafike.site — see grafike-admin note above.
  traefik.http.routers.grafike-assets.rule: "(Host(`${APP_DOMAIN}`) || Host(`graficms.grafike.site`)) && (PathPrefix(`/build`) || PathPrefix(`/storage`) || PathPrefix(`/tenant-assets`) || PathPrefix(`/tenancy`) || PathPrefix(`/vendor`) || PathPrefix(`/livewire`) || PathPrefix(`/up`))"
  traefik.http.routers.grafike-assets.entrypoints: websecure
  traefik.http.routers.grafike-assets.tls: "true"
  traefik.http.routers.grafike-assets.tls.certresolver: mytlschallenge
  # ACME scope — see grafike-admin note above.
  traefik.http.routers.grafike-assets.tls.domains[0].main: graficms.grafike.site
  traefik.http.routers.grafike-assets.service: grafike-lb
  traefik.http.routers.grafike-assets.middlewares: grafike-headers@docker
  traefik.http.routers.grafike-assets.priority: "200"

  # ── Load balancer service ───────────────────────────────────────────────────
  # NOTE: No loadbalancer.healthcheck.* labels here.
  # Docker's own HEALTHCHECK (defined in the Dockerfile) signals container health
  # to Traefik. Adding Traefik-level healthcheck labels on SOME containers but
  # not others creates conflicting service definitions that cause Traefik to
  # silently drop the entire service and all its associated routers.
  traefik.http.services.grafike-lb.loadbalancer.server.port: "80"

  # ── Security headers middleware ─────────────────────────────────────────────
  traefik.http.middlewares.grafike-headers.headers.SSLRedirect: "true"
  traefik.http.middlewares.grafike-headers.headers.STSSeconds: "315360000"
  traefik.http.middlewares.grafike-headers.headers.browserXSSFilter: "true"
  traefik.http.middlewares.grafike-headers.headers.contentTypeNosniff: "true"
  traefik.http.middlewares.grafike-headers.headers.forceSTSHeader: "true"
  traefik.http.middlewares.grafike-headers.headers.SSLHost: ${APP_DOMAIN}
  traefik.http.middlewares.grafike-headers.headers.STSIncludeSubdomains: "true"
  traefik.http.middlewares.grafike-headers.headers.STSPreload: "true"

  # ── Tenant backend catch-all (LAST-RESORT FALLBACK only) ───────────────────
  # Priority 1 = lowest.  Per-tenant Host() routers generated by Laravel's
  # TraefikDynamicConfig service (file provider, priority 100) take precedence
  # for every domain in the `domains` table.  This wildcard exists only so
  # that requests for *unknown* hosts still get a clean response (Laravel's
  # InitializeTenancyByDomain will abort(404) — better than Traefik's bare
  # 404 page).
  #
  # NO cert resolver here on purpose: HostRegexp cannot enumerate matching
  # domains, so attaching ACME triggers spurious / failing cert requests
  # against every SNI Traefik happens to see.  Cert issuance for known
  # tenants is handled by the file-provider routers (per-domain HTTP-01).
  # Unknown-host requests over HTTPS get Traefik's default cert + a 404 —
  # acceptable for a fallback.
  traefik.http.routers.grafike-tenants.rule: "HostRegexp(`.+`)"
  traefik.http.routers.grafike-tenants.entrypoints: websecure
  traefik.http.routers.grafike-tenants.tls: "true"
  traefik.http.routers.grafike-tenants.service: grafike-lb
  traefik.http.routers.grafike-tenants.priority: "1"

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  environment:
    <<: *app-env
  depends_on:
    redis:
      condition: service_healthy
  volumes:
    - grafike_storage_app:/var/www/html/storage/app
    - grafike_storage_logs:/var/www/html/storage/logs
    # Shared mount for the Traefik file provider.  Laravel (this container)
    # writes /var/traefik-dynamic/tenants.json on every Domain CRUD; Traefik
    # reads the same host path as /etc/traefik/dynamic and hot-reloads.
    # The host path is created by `mkdir -p ./traefik-dynamic` during deploy.
    - ./traefik-dynamic:/var/traefik-dynamic:rw
  networks:
    - app_net
    - traefik_proxy

services:

  # ── 3 identical app containers — all serve all tenant sites ─────────────────
  app1:
    <<: *app-common
    container_name: grafike_cms_app1
    labels:
      <<: *app-labels

  app2:
    <<: *app-common
    container_name: grafike_cms_app2
    labels:
      <<: *app-labels

  app3:
    <<: *app-common
    container_name: grafike_cms_app3
    labels:
      <<: *app-labels

  # ── Queue worker ─────────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${QUEUE_CONTAINER_NAME:-grafike_cms_queue}
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    environment:
      <<: *app-env
    # The Dockerfile HEALTHCHECK tests nginx (/index.php). Queue workers don't
    # run nginx so the check always fails → shows (unhealthy). Disable it here.
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_started
    volumes:
      - grafike_storage_app:/var/www/html/storage/app
      - grafike_storage_logs:/var/www/html/storage/logs
      # Queue workers can trigger Domain CRUD (e.g. async tenant provisioning),
      # so they also need write access to the Traefik file-provider mount.
      - ./traefik-dynamic:/var/traefik-dynamic:rw
    networks:
      - app_net

  # ── Scheduler: single container is sufficient ────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${SCHEDULER_CONTAINER_NAME:-grafike_cms_scheduler}
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - .env
    environment:
      <<: *app-env
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_started
    volumes:
      - grafike_storage_app:/var/www/html/storage/app
      - grafike_storage_logs:/var/www/html/storage/logs
      # Scheduler runs the hourly `traefik:sync` drift-detector; needs write access.
      - ./traefik-dynamic:/var/traefik-dynamic:rw
    networks:
      - app_net

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${CMS_FRONTEND_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-tr}
        NEXT_PUBLIC_SUPPORTED_LOCALES: ${NEXT_PUBLIC_SUPPORTED_LOCALES:-tr}
        NEXT_PUBLIC_APP_ENV: production
    container_name: grafike_cms_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # SSR internal API calls go directly to app1 (bypasses Traefik)
      CMS_API_URL: http://app1:80
      NEXT_PUBLIC_SITE_URL: ${CMS_FRONTEND_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-tr}
      NEXT_PUBLIC_SUPPORTED_LOCALES: ${NEXT_PUBLIC_SUPPORTED_LOCALES:-tr}
      REVALIDATE_SECRET: ${CMS_REVALIDATE_SECRET}
      NEXT_PUBLIC_APP_ENV: production
    depends_on:
      - app1
    networks:
      - app_net
      - traefik_proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_proxy
      # Frontend catch-all (LAST-RESORT FALLBACK only).  Per-tenant Host()
      # routers from the file provider (priority 100) take precedence for
      # known domains.  This rule matches the CMS admin domain (e.g.
      # `cms.grafcore.com`) and unknown hosts for non-backend paths;
      # backend paths route to PHP via the explicit grafike-* routers at
      # priority 200.
      #
      # NO cert resolver here: HostRegexp can't enumerate domains for ACME.
      # The static `grafike-admin` router (Host(`${APP_DOMAIN}`)) owns the
      # admin-domain cert; tenant certs are issued via the file provider
      # routers (per-domain HTTP-01).
      # Traefik v3 syntax: plain regex inside HostRegexp (no `{name:pattern}` group).
      traefik.http.routers.grafike-frontend.rule: "HostRegexp(`.+`) && !(PathPrefix(`/admin`) || PathPrefix(`/api`) || PathPrefix(`/build`) || PathPrefix(`/storage`) || PathPrefix(`/tenant-assets`) || PathPrefix(`/tenancy`) || PathPrefix(`/vendor`) || PathPrefix(`/livewire`) || Path(`/up`))"
      traefik.http.routers.grafike-frontend.entrypoints: websecure
      traefik.http.routers.grafike-frontend.tls: "true"
      traefik.http.routers.grafike-frontend.priority: "2"
      traefik.http.services.grafike-frontend.loadbalancer.server.port: "3000"

  # ── Redis (cache + session + queue) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-grafike_cms_redis}
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - grafike_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

volumes:
  grafike_storage_app:
    # stancl's FilesystemTenancyBootstrapper isolates storage paths per tenant:
    #   storage/app/tenant_nuhcicek/
    #   storage/app/tenant_firma2/
  grafike_storage_logs:
  grafike_redis_data:

networks:
  app_net:
    driver: bridge
  traefik_proxy:
    external: true
