# ─────────────────────────────────────────────────────────────────────────────
# Grafike CMS — High-Availability Docker Compose
#
# Architecture:
#   3 identical app containers (app1/app2/app3) all serve ALL tenant sites.
#   Traefik health-checks each container via Docker HEALTHCHECK; if one crashes
#   the other two continue serving 100% of traffic — no site goes down.
#
#   MariaDB and Traefik run in separate containers on the same VPS and are NOT
#   defined here. They are reached via the shared `traefik_proxy` external network.
# ─────────────────────────────────────────────────────────────────────────────

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL}
  APP_KEY: ${APP_KEY}

  # MariaDB is an external container on this VPS — connect by container name.
  DB_CONNECTION: mariadb
  DB_HOST: ${DB_HOST:-mariadb-admindb}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}

  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Grafike CMS}

  SESSION_DOMAIN: ${SESSION_DOMAIN:-}
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: lax

  CMS_CACHE_ENABLED: ${CMS_CACHE_ENABLED:-true}
  CMS_CACHE_TTL: ${CMS_CACHE_TTL:-600}
  CMS_FRONTEND_URL: ${CMS_FRONTEND_URL:-}
  CMS_REVALIDATE_SECRET: ${CMS_REVALIDATE_SECRET}

  # stancl/tenancy
  TENANCY_DB_PREFIX: ${TENANCY_DB_PREFIX:-tenant_}
  CENTRAL_DOMAIN: ${APP_DOMAIN}

# ── Traefik labels shared across ALL 3 app containers ──────────────────────
# Defining identical labels on all 3 ensures:
#  - Routers (grafike-admin, grafike-api, grafike-assets) survive if any single
#    container goes down — Traefik always has at least one source for the config.
#  - The grafike-lb service definition is CONSISTENT across containers.
#    Inconsistent service definitions (e.g. healthcheck on app1 only) cause
#    Traefik to silently drop the entire service and all its routers.
x-app-labels: &app-labels
  traefik.enable: "true"
  traefik.docker.network: traefik_proxy

  # ── Backend router: /admin ──────────────────────────────────────────────────
  traefik.http.routers.grafike-admin.rule: "Host(`${APP_DOMAIN}`) && PathPrefix(`/admin`)"
  traefik.http.routers.grafike-admin.entrypoints: websecure
  traefik.http.routers.grafike-admin.tls: "true"
  traefik.http.routers.grafike-admin.tls.certresolver: mytlschallenge
  traefik.http.routers.grafike-admin.service: grafike-lb
  traefik.http.routers.grafike-admin.middlewares: grafike-headers@docker
  traefik.http.routers.grafike-admin.priority: "200"

  # ── Backend router: /api ────────────────────────────────────────────────────
  traefik.http.routers.grafike-api.rule: "Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)"
  traefik.http.routers.grafike-api.entrypoints: websecure
  traefik.http.routers.grafike-api.tls: "true"
  traefik.http.routers.grafike-api.tls.certresolver: mytlschallenge
  traefik.http.routers.grafike-api.service: grafike-lb
  traefik.http.routers.grafike-api.middlewares: grafike-headers@docker
  traefik.http.routers.grafike-api.priority: "200"

  # ── Backend router: static assets + health ─────────────────────────────────
  traefik.http.routers.grafike-assets.rule: "Host(`${APP_DOMAIN}`) && (PathPrefix(`/build`) || PathPrefix(`/storage`) || PathPrefix(`/vendor`) || PathPrefix(`/livewire`) || PathPrefix(`/up`))"
  traefik.http.routers.grafike-assets.entrypoints: websecure
  traefik.http.routers.grafike-assets.tls: "true"
  traefik.http.routers.grafike-assets.tls.certresolver: mytlschallenge
  traefik.http.routers.grafike-assets.service: grafike-lb
  traefik.http.routers.grafike-assets.middlewares: grafike-headers@docker
  traefik.http.routers.grafike-assets.priority: "200"

  # ── Load balancer service ───────────────────────────────────────────────────
  # NOTE: No loadbalancer.healthcheck.* labels here.
  # Docker's own HEALTHCHECK (defined in the Dockerfile) signals container health
  # to Traefik. Adding Traefik-level healthcheck labels on SOME containers but
  # not others creates conflicting service definitions that cause Traefik to
  # silently drop the entire service and all its associated routers.
  traefik.http.services.grafike-lb.loadbalancer.server.port: "80"

  # ── Security headers middleware ─────────────────────────────────────────────
  traefik.http.middlewares.grafike-headers.headers.SSLRedirect: "true"
  traefik.http.middlewares.grafike-headers.headers.STSSeconds: "315360000"
  traefik.http.middlewares.grafike-headers.headers.browserXSSFilter: "true"
  traefik.http.middlewares.grafike-headers.headers.contentTypeNosniff: "true"
  traefik.http.middlewares.grafike-headers.headers.forceSTSHeader: "true"
  traefik.http.middlewares.grafike-headers.headers.SSLHost: ${APP_DOMAIN}
  traefik.http.middlewares.grafike-headers.headers.STSIncludeSubdomains: "true"
  traefik.http.middlewares.grafike-headers.headers.STSPreload: "true"

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env
  environment:
    <<: *app-env
  depends_on:
    redis:
      condition: service_healthy
  volumes:
    - grafike_storage_app:/var/www/html/storage/app
    - grafike_storage_logs:/var/www/html/storage/logs
  networks:
    - app_net
    - traefik_proxy

services:

  # ── 3 identical app containers — all serve all tenant sites ─────────────────
  app1:
    <<: *app-common
    container_name: grafike_cms_app1
    labels:
      <<: *app-labels

  app2:
    <<: *app-common
    container_name: grafike_cms_app2
    labels:
      <<: *app-labels

  app3:
    <<: *app-common
    container_name: grafike_cms_app3
    labels:
      <<: *app-labels

  # ── Queue worker ─────────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${QUEUE_CONTAINER_NAME:-grafike_cms_queue}
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    environment:
      <<: *app-env
    # The Dockerfile HEALTHCHECK tests nginx (/index.php). Queue workers don't
    # run nginx so the check always fails → shows (unhealthy). Disable it here.
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_started
    volumes:
      - grafike_storage_app:/var/www/html/storage/app
      - grafike_storage_logs:/var/www/html/storage/logs
    networks:
      - app_net

  # ── Scheduler: single container is sufficient ────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${SCHEDULER_CONTAINER_NAME:-grafike_cms_scheduler}
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - .env
    environment:
      <<: *app-env
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_started
    volumes:
      - grafike_storage_app:/var/www/html/storage/app
      - grafike_storage_logs:/var/www/html/storage/logs
    networks:
      - app_net

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${CMS_FRONTEND_URL:-http://localhost:3000}
        NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-tr}
        NEXT_PUBLIC_SUPPORTED_LOCALES: ${NEXT_PUBLIC_SUPPORTED_LOCALES:-tr}
        NEXT_PUBLIC_APP_ENV: production
    container_name: grafike_cms_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # SSR internal API calls go directly to app1 (bypasses Traefik)
      CMS_API_URL: http://app1:80
      NEXT_PUBLIC_SITE_URL: ${CMS_FRONTEND_URL:-http://localhost:3000}
      NEXT_PUBLIC_API_URL: ${APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-tr}
      NEXT_PUBLIC_SUPPORTED_LOCALES: ${NEXT_PUBLIC_SUPPORTED_LOCALES:-tr}
      REVALIDATE_SECRET: ${CMS_REVALIDATE_SECRET}
      NEXT_PUBLIC_APP_ENV: production
    depends_on:
      - app1
    networks:
      - app_net
      - traefik_proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_proxy
      # Frontend catches everything on APP_DOMAIN that isn't a backend path.
      # Priority 10 (lower than backend routers at 200) so backend routes win.
      traefik.http.routers.grafike-frontend.rule: "Host(`${APP_DOMAIN}`) && !(PathPrefix(`/admin`) || PathPrefix(`/api`) || PathPrefix(`/build`) || PathPrefix(`/storage`) || PathPrefix(`/vendor`) || PathPrefix(`/livewire`) || Path(`/up`))"
      traefik.http.routers.grafike-frontend.entrypoints: websecure
      traefik.http.routers.grafike-frontend.tls: "true"
      traefik.http.routers.grafike-frontend.tls.certresolver: mytlschallenge
      traefik.http.routers.grafike-frontend.priority: "10"
      traefik.http.services.grafike-frontend.loadbalancer.server.port: "3000"

  # ── Redis (cache + session + queue) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-grafike_cms_redis}
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - grafike_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

volumes:
  grafike_storage_app:
    # stancl's FilesystemTenancyBootstrapper isolates storage paths per tenant:
    #   storage/app/tenant_nuhcicek/
    #   storage/app/tenant_firma2/
  grafike_storage_logs:
  grafike_redis_data:

networks:
  app_net:
    driver: bridge
  traefik_proxy:
    external: true
