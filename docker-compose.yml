# ─────────────────────────────────────────────────────────────────────────────
# Grafike CMS — High-Availability Docker Compose
#
# Architecture:
#   3 identical app containers (app1/app2/app3) all serve ALL tenant sites.
#   Traefik health-checks each container; if one crashes the other two continue
#   serving 100% of traffic — no site goes down.
#
#   ┌─ Traefik (reverse proxy + SSL + health check) ─────────────────────────┐
#   │   app1 (Laravel) ─┐                                                    │
#   │   app2 (Laravel) ─┼──→ all tenants → shared Redis → shared MariaDB     │
#   │   app3 (Laravel) ─┘                                                    │
#   └────────────────────────────────────────────────────────────────────────┘
#
# YAML anchor to avoid repeating shared config across app1/app2/app3.
# ─────────────────────────────────────────────────────────────────────────────

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: ${APP_URL}
  APP_KEY: ${APP_KEY}

  DB_CONNECTION: mariadb
  DB_HOST: ${DB_HOST:-mariadb}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE}
  DB_USERNAME: ${DB_USERNAME}
  DB_PASSWORD: ${DB_PASSWORD}
  DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}

  CACHE_STORE: redis
  QUEUE_CONNECTION: redis
  SESSION_DRIVER: redis
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:-}

  MAIL_MAILER: ${MAIL_MAILER:-smtp}
  MAIL_HOST: ${MAIL_HOST:-}
  MAIL_PORT: ${MAIL_PORT:-587}
  MAIL_USERNAME: ${MAIL_USERNAME:-}
  MAIL_PASSWORD: ${MAIL_PASSWORD:-}
  MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
  MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
  MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Grafike CMS}

  SESSION_DOMAIN: ${SESSION_DOMAIN:-}
  SESSION_SECURE_COOKIE: "true"
  SESSION_SAME_SITE: lax

  CMS_CACHE_ENABLED: ${CMS_CACHE_ENABLED:-true}
  CMS_CACHE_TTL: ${CMS_CACHE_TTL:-600}
  CMS_FRONTEND_URL: http://frontend:3000
  CMS_REVALIDATE_SECRET: ${CMS_REVALIDATE_SECRET}

  SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}

  OCTANE_SERVER: frankenphp

  # stancl/tenancy — DB prefix for tenant databases (e.g. tenant_nuhcicek)
  TENANCY_DB_PREFIX: tenant_
  CENTRAL_DOMAIN: ${APP_DOMAIN}

x-app-common: &app-common
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  env_file:
    - .env.hostinger
  depends_on:
    mariadb:
      condition: service_healthy
    redis:
      condition: service_healthy
    frontend:
      condition: service_started
  volumes:
    - grafike_storage:/var/www/html/storage
  networks:
    - app_net
    - traefik_proxy

x-app-labels: &app-labels
  traefik.enable: "true"
  traefik.docker.network: traefik_proxy
  # All 3 containers join the same Traefik service — round-robin load balancing
  traefik.http.services.grafike-lb.loadbalancer.server.port: "80"
  # Health check: Traefik removes a container from rotation when /up returns non-2xx
  traefik.http.services.grafike-lb.loadbalancer.healthcheck.path: /up
  traefik.http.services.grafike-lb.loadbalancer.healthcheck.interval: 10s
  traefik.http.services.grafike-lb.loadbalancer.healthcheck.timeout: 5s
  # Router (only needs to be defined once — shared service handles the rest)
  traefik.http.routers.grafike.rule: Host(`${APP_DOMAIN}`)
  traefik.http.routers.grafike.entrypoints: websecure
  traefik.http.routers.grafike.tls: "true"
  traefik.http.routers.grafike.tls.certresolver: mytlschallenge
  traefik.http.routers.grafike.service: grafike-lb
  traefik.http.routers.grafike.middlewares: grafike-headers@docker
  # Security headers middleware
  traefik.http.middlewares.grafike-headers.headers.SSLRedirect: "true"
  traefik.http.middlewares.grafike-headers.headers.STSSeconds: "315360000"
  traefik.http.middlewares.grafike-headers.headers.browserXSSFilter: "true"
  traefik.http.middlewares.grafike-headers.headers.contentTypeNosniff: "true"
  traefik.http.middlewares.grafike-headers.headers.forceSTSHeader: "true"
  traefik.http.middlewares.grafike-headers.headers.SSLHost: ${APP_DOMAIN}
  traefik.http.middlewares.grafike-headers.headers.STSIncludeSubdomains: "true"
  traefik.http.middlewares.grafike-headers.headers.STSPreload: "true"

services:

  # ── 3 identical app containers — all serve all tenant sites ─────────────────
  app1:
    <<: *app-common
    container_name: grafike_app1
    environment:
      <<: *app-env
    labels:
      <<: *app-labels

  app2:
    <<: *app-common
    container_name: grafike_app2
    environment:
      <<: *app-env
    labels:
      <<: *app-labels

  app3:
    <<: *app-common
    container_name: grafike_app3
    environment:
      <<: *app-env
    labels:
      <<: *app-labels

  # ── Queue worker ─────────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grafike_queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env.hostinger
    environment:
      <<: *app-env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - grafike_storage:/var/www/html/storage
    networks:
      - app_net

  # ── Scheduler: single container is sufficient ────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grafike_scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - .env.hostinger
    environment:
      <<: *app-env
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - grafike_storage:/var/www/html/storage
    networks:
      - app_net

  # ── Next.js frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: grafike_frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Internal API calls go to app1 (SSR); public traffic load-balanced by Traefik
      CMS_API_URL: http://app1:80
      NEXT_PUBLIC_SITE_URL: https://${FRONTEND_DOMAIN}
      NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-tr}
      NEXT_PUBLIC_SUPPORTED_LOCALES: ${NEXT_PUBLIC_SUPPORTED_LOCALES:-tr}
      REVALIDATE_SECRET: ${CMS_REVALIDATE_SECRET}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      NEXT_PUBLIC_APP_ENV: production
    depends_on:
      - app1
    networks:
      - app_net
      - traefik_proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_proxy
      traefik.http.routers.grafike-frontend.rule: Host(`${FRONTEND_DOMAIN}`)
      traefik.http.routers.grafike-frontend.entrypoints: websecure
      traefik.http.routers.grafike-frontend.tls: "true"
      traefik.http.routers.grafike-frontend.tls.certresolver: mytlschallenge
      traefik.http.services.grafike-frontend.loadbalancer.server.port: "3000"

  # ── Redis (cache + session + queue) ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: grafike_redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - grafike_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  # ── MariaDB (central DB + 200 tenant DBs) ───────────────────────────────────
  mariadb:
    image: mariadb:11
    container_name: grafike_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --innodb-buffer-pool-size=512M
      --innodb-log-file-size=128M
      --max-connections=300
      --query-cache-size=0
    volumes:
      - grafike_mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_net

volumes:
  grafike_storage:
    # Single shared storage volume mounted by all app containers.
    # stancl's FilesystemTenancyBootstrapper isolates paths per tenant:
    #   storage/app/tenant_nuhcicek/
    #   storage/app/tenant_firma2/
  grafike_mariadb_data:
  grafike_redis_data:

networks:
  app_net:
    driver: bridge
  traefik_proxy:
    external: true
