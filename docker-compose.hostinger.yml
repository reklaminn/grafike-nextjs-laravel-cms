services:

  # ── Single app container (Hostinger single-VPS deployment) ───────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${APP_CONTAINER_NAME:-grafike_cms_app}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mariadb
      DB_HOST: ${DB_HOST:-mariadb-admindb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      MAIL_MAILER: ${MAIL_MAILER:-smtp}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_ENCRYPTION: ${MAIL_ENCRYPTION:-tls}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-noreply@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Grafike CMS}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SESSION_SECURE_COOKIE: "true"
      SESSION_SAME_SITE: lax
      CMS_CACHE_ENABLED: ${CMS_CACHE_ENABLED:-true}
      CMS_CACHE_TTL: ${CMS_CACHE_TTL:-600}
      TENANCY_DB_PREFIX: ${TENANCY_DB_PREFIX:-tenant_}
      CENTRAL_DOMAIN: ${APP_DOMAIN}
      SENTRY_LARAVEL_DSN: ${SENTRY_LARAVEL_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
    depends_on:
      redis:
        condition: service_started
    volumes:
      - grafike_storage_app:/var/www/html/storage/app
      - grafike_storage_logs:/var/www/html/storage/logs
    networks:
      - app_net
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # ── HTTP → HTTPS global redirect ──────────────────────────────────────
      # Catches ALL http:// requests (any host) and redirects to https://.
      # permanent=false → 307 Temporary Redirect (method-preserving).
      # DO NOT use permanent=true (301): browsers convert POST → GET on 301,
      # silently discarding form bodies (sections_json, CSRF tokens, etc.).
      - "traefik.http.routers.http-catchall.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.http-catchall.entrypoints=web"
      - "traefik.http.routers.http-catchall.middlewares=https-redirect"
      - "traefik.http.routers.http-catchall.priority=1"
      - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
      - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=false"

      # ── /admin → Laravel ──────────────────────────────────────────────────
      - "traefik.http.routers.grafike-admin.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.grafike-admin.entrypoints=websecure"
      - "traefik.http.routers.grafike-admin.tls=true"
      - "traefik.http.routers.grafike-admin.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.grafike-admin.service=grafike-lb"
      - "traefik.http.routers.grafike-admin.middlewares=grafike-headers@docker"
      - "traefik.http.routers.grafike-admin.priority=200"

      # ── /api → Laravel ────────────────────────────────────────────────────
      - "traefik.http.routers.grafike-api.rule=Host(`${APP_DOMAIN}`) && PathPrefix(`/api`)"
      - "traefik.http.routers.grafike-api.entrypoints=websecure"
      - "traefik.http.routers.grafike-api.tls=true"
      - "traefik.http.routers.grafike-api.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.grafike-api.service=grafike-lb"
      - "traefik.http.routers.grafike-api.middlewares=grafike-headers@docker"
      - "traefik.http.routers.grafike-api.priority=200"

      # ── Static assets + health → Laravel ──────────────────────────────────
      - "traefik.http.routers.grafike-assets.rule=Host(`${APP_DOMAIN}`) && (PathPrefix(`/build`) || PathPrefix(`/storage`) || PathPrefix(`/tenant-assets`) || PathPrefix(`/tenancy`) || PathPrefix(`/vendor`) || PathPrefix(`/livewire`) || PathPrefix(`/up`))"
      - "traefik.http.routers.grafike-assets.entrypoints=websecure"
      - "traefik.http.routers.grafike-assets.tls=true"
      - "traefik.http.routers.grafike-assets.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.grafike-assets.service=grafike-lb"
      - "traefik.http.routers.grafike-assets.middlewares=grafike-headers@docker"
      - "traefik.http.routers.grafike-assets.priority=200"

      # ── Load balancer service ──────────────────────────────────────────────
      - "traefik.http.services.grafike-lb.loadbalancer.server.port=80"

      # ── Security headers middleware ────────────────────────────────────────
      - "traefik.http.middlewares.grafike-headers.headers.SSLRedirect=true"
      - "traefik.http.middlewares.grafike-headers.headers.STSSeconds=315360000"
      - "traefik.http.middlewares.grafike-headers.headers.browserXSSFilter=true"
      - "traefik.http.middlewares.grafike-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.grafike-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.grafike-headers.headers.SSLHost=${APP_DOMAIN}"
      - "traefik.http.middlewares.grafike-headers.headers.STSIncludeSubdomains=true"
      - "traefik.http.middlewares.grafike-headers.headers.STSPreload=true"

      # ── Tenant backend paths → Laravel (any domain, priority 50) ─────────────
      # Catches Laravel-served paths on EVERY domain (including tenant custom
      # domains).  Higher priority than the frontend catch-all (1) so member
      # auth, form submissions, sitemap, etc. always reach Laravel even when
      # the request comes from nuhcicek.com.tr instead of the CMS domain.
      # APP_DOMAIN backend paths are already handled by the priority-200 routers
      # above; this rule only "wins" for tenant custom domains.
      - "traefik.http.routers.grafike-backend.rule=PathPrefix(`/member`) || PathPrefix(`/api`) || PathPrefix(`/forms`) || PathPrefix(`/reviews`) || PathPrefix(`/pages`) || PathPrefix(`/lang`) || PathPrefix(`/tenant-assets`) || PathPrefix(`/tenancy`) || PathPrefix(`/storage`) || PathPrefix(`/build`) || PathPrefix(`/vendor`) || PathPrefix(`/livewire`) || Path(`/up`) || Path(`/sitemap.xml`) || Path(`/robots.txt`) || Path(`/llms.txt`) || Path(`/llms-full.txt`) || PathPrefix(`/.well-known`)"
      - "traefik.http.routers.grafike-backend.entrypoints=websecure"
      - "traefik.http.routers.grafike-backend.tls=true"
      - "traefik.http.routers.grafike-backend.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.grafike-backend.service=grafike-lb"
      - "traefik.http.routers.grafike-backend.priority=50"

  # ── Next.js frontend (SSR + ISR) ─────────────────────────────────────────────
  # Serves public pages for the CMS domain AND all tenant custom domains.
  # SSR calls Laravel internally via CMS_API_URL (bypasses Traefik).
  # On-demand ISR revalidation is triggered by Laravel observers via
  # POST /api/revalidate using the REVALIDATE_SECRET shared secret.
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SITE_URL: ${CMS_FRONTEND_URL:-https://localhost:3000}
        NEXT_PUBLIC_API_URL: ${APP_URL}
        NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-tr}
        NEXT_PUBLIC_SUPPORTED_LOCALES: ${NEXT_PUBLIC_SUPPORTED_LOCALES:-tr}
        NEXT_PUBLIC_APP_ENV: production
    container_name: ${FRONTEND_CONTAINER_NAME:-grafike_cms_frontend}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Internal Docker network — bypasses Traefik for low-latency SSR API calls
      CMS_API_URL: http://app:80
      NEXT_PUBLIC_SITE_URL: ${CMS_FRONTEND_URL}
      NEXT_PUBLIC_API_URL: ${APP_URL}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-tr}
      NEXT_PUBLIC_SUPPORTED_LOCALES: ${NEXT_PUBLIC_SUPPORTED_LOCALES:-tr}
      REVALIDATE_SECRET: ${CMS_REVALIDATE_SECRET}
      NEXT_PUBLIC_APP_ENV: production
    depends_on:
      - app
    networks:
      - app_net
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"

      # ── CMS domain public pages → Next.js (priority 10) ───────────────────
      # Non-backend paths on APP_DOMAIN go to Next.js SSR.
      # Priority 10 loses to backend routers (200) but wins over catch-all (1).
      - "traefik.http.routers.grafike-frontend.rule=Host(`${APP_DOMAIN}`) && !(PathPrefix(`/admin`) || PathPrefix(`/api`) || PathPrefix(`/member`) || PathPrefix(`/forms`) || PathPrefix(`/tenant-assets`) || PathPrefix(`/tenancy`) || PathPrefix(`/storage`) || PathPrefix(`/build`) || PathPrefix(`/vendor`) || PathPrefix(`/livewire`) || Path(`/up`) || Path(`/sitemap.xml`) || Path(`/robots.txt`))"
      - "traefik.http.routers.grafike-frontend.entrypoints=websecure"
      - "traefik.http.routers.grafike-frontend.tls=true"
      - "traefik.http.routers.grafike-frontend.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.grafike-frontend.service=grafike-frontend-lb"
      - "traefik.http.routers.grafike-frontend.priority=10"

      # ── Tenant custom domains → Next.js (priority 1, catch-all) ──────────
      # Any domain not already matched by a higher-priority backend router
      # lands here.  Traefik auto-provisions a Let's Encrypt cert for each
      # new hostname via HTTP-01 challenge.
      # Next.js reads the Host header → calls Laravel API with X-Site-Host →
      # stancl resolves the tenant → returns that tenant's content.
      - "traefik.http.routers.grafike-tenant-frontend.rule=HostRegexp(`{host:.+}`)"
      - "traefik.http.routers.grafike-tenant-frontend.entrypoints=websecure"
      - "traefik.http.routers.grafike-tenant-frontend.tls=true"
      - "traefik.http.routers.grafike-tenant-frontend.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.grafike-tenant-frontend.service=grafike-frontend-lb"
      - "traefik.http.routers.grafike-tenant-frontend.priority=1"

      # ── Load balancer ──────────────────────────────────────────────────────
      - "traefik.http.services.grafike-frontend-lb.loadbalancer.server.port=3000"

  # ── Queue worker ─────────────────────────────────────────────────────────────
  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${QUEUE_CONTAINER_NAME:-grafike_cms_queue}
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mariadb
      DB_HOST: ${DB_HOST:-mariadb-admindb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # Dockerfile HEALTHCHECK tests nginx; queue workers don't run nginx → always unhealthy.
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_started
    volumes:
      - grafike_storage_app:/var/www/html/storage/app
      - grafike_storage_logs:/var/www/html/storage/logs
    networks:
      - app_net

  # ── Scheduler ────────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${SCHEDULER_CONTAINER_NAME:-grafike_cms_scheduler}
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: mariadb
      DB_HOST: ${DB_HOST:-mariadb-admindb}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      disable: true
    depends_on:
      redis:
        condition: service_started
    volumes:
      - grafike_storage_app:/var/www/html/storage/app
      - grafike_storage_logs:/var/www/html/storage/logs
    networks:
      - app_net

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME:-grafike_cms_redis}
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - grafike_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

volumes:
  grafike_storage_app:
  grafike_storage_logs:
  grafike_redis_data:

networks:
  app_net:
    driver: bridge
  traefik_proxy:
    external: true
